[package]
name = "cargo-about-cached"
version = "0.1.1"
edition = "2024"

[dependencies]
cargo-about = "0.9"
cargo-lock = "11.1"
serde = "1.0"
serde_json = "1.0"
cargo_metadata = "0.23"
sha256 = "1.6"
semver = "1.0"
krates = "0.21"
spdx = "0.13"
anyhow = "1.0"
toml-span = "0.7.2"
clap = { version = "4.6", features = ["derive"] }
codespan-reporting = "0.13"
handlebars = "6.4"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ureq = { version = "3.4", default-features = false, features = [
  "platform-verifier",
  "rustls-no-provider",
] }
